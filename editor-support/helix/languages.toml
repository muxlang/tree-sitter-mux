# Drop-in Helix config for Mux. Append to ~/.config/helix/languages.toml, then:
#
#   hx --grammar fetch && hx --grammar build
#
# Keep this revision in sync with the Helix examples in INTEGRATION.md.
#
# Helix does not read queries/ out of the grammar repo, so install the
# highlights separately - see INTEGRATION.md.

[[language]]
name = "mux"
scope = "source.mux"
injection-regex = "mux"
file-types = ["mux"]
comment-token = "//"
block-comment-tokens = { start = "/*", end = "*/" }
grammar = "mux"

[[grammar]]
name = "mux"
source = { git = "https://github.com/muxlang/tree-sitter-mux", rev = "62de9d4500975790c18a6bc4f19a721107076de9" }
