name: Build
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  # Supersede an in-flight run for the SAME PR. Push runs deliberately get a
  # unique group (run_id): a shared group keeps only one pending run, so rapid
  # pushes to main would evict an intermediate commit's queued run before it
  # ever ran, leaving that commit unverified.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  lint_workflows:
    # actionlint plus its built-in shellcheck integration (active once
    # shellcheck is on PATH, which it is on this image) - context #29's
    # lint-the-pipeline-itself ask. Ungated: a workflow-only change is exactly
    # what this exists to catch, and it is cheap enough not to need a filter.
    name: Lint Workflows
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: actionlint + shellcheck
        run: ./scripts/ci/lint-workflows.sh

  grammar:
    name: Grammar
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
      - name: JavaScript quality
        run: npm ci --ignore-scripts && npm run lint && npm run format:check
      - run: npm install -g tree-sitter-cli@0.26.8
      - name: Parse and highlight checked-in samples
        run: npm run samples
      - name: Verify vendored syntax-matrix.json matches canonical
        env:
          PR_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          ref=main
          if [ "${{ github.event_name }}" = pull_request ]; then
            branch="$PR_BRANCH"
            if git ls-remote --exit-code --heads https://github.com/muxlang/mux-syntax-highlighting.git "refs/heads/${branch}" >/dev/null 2>&1; then
              ref="$branch"
            fi
          fi
          curl --proto '=https' -fsSL "https://raw.githubusercontent.com/muxlang/mux-syntax-highlighting/${ref}/shared/syntax-matrix.json?cachebust=${GITHUB_SHA}" -o /tmp/canonical-syntax-matrix.json
          if ! diff -u /tmp/canonical-syntax-matrix.json ./syntax-matrix.json; then
            echo "::error::Vendored syntax-matrix.json has drifted from canonical shared/syntax-matrix.json in muxlang/mux-syntax-highlighting (${ref})."
            echo "Re-sync it with: ./scripts/sync-matrix.sh (then commit the updated syntax-matrix.json)."
            exit 1
          fi
      - name: Generate parser
        run: tree-sitter generate grammar.js
      - name: Verify the committed parser matches grammar.js
        # Consumers compile the committed src/parser.c rather than generating it,
        # so a stale copy would ship a parser that does not match this grammar.
        run: |
          set -euo pipefail
          if ! git diff --exit-code -- src/; then
            echo "::error::Committed parser is stale. Run 'tree-sitter generate' and commit src/."
            exit 1
          fi
      - name: Corpus tests
        run: tree-sitter test

  parser_abi_compatibility:
    name: Parser ABI compatibility (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: linux-x64
            sha256: 9754a32800f0b970152782df177b4a47c711e34e651a7aceb384d8bd29fa136e
            extension: ''
          - os: windows-latest
            asset: windows-x64
            sha256: 28301a969412066bf4818c30c71d9c313091a9b9dc24b53a14ddda3a8e2cc2bb
            extension: .exe
          - os: macos-latest
            asset: macos-arm64
            sha256: 024e2cee34723524d62d41bde2d4baf23c8bbe0236e116c79c0b37d9575889e
            extension: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-tree-sitter
        with:
          asset: ${{ matrix.asset }}
          sha256: ${{ matrix.sha256 }}
          extension: ${{ matrix.extension }}
      - uses: tree-sitter/parser-test-action@05f6ce7c7e54603c45cd87ed926725dc870bcc63 # v3
        with:
          abi-version: "15"

  query_validation:
    name: Reference query validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-tree-sitter
        with:
          asset: linux-x64
          sha256: 9754a32800f0b970152782df177b4a47c711e34e651a7aceb384d8bd29fa136e
      - name: Install and run pinned ts_query_ls
        run: |
          set -euo pipefail
          parser_dir="$RUNNER_TEMP/parsers"
          query_workspace="$RUNNER_TEMP/query-workspace"
          mkdir -p "$parser_dir" "$query_workspace/queries/mux"
          tree-sitter build --output "$parser_dir/mux.so"
          cp queries/*.scm "$query_workspace/queries/mux/"
          archive="$RUNNER_TEMP/ts_query_ls.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSL \
            https://github.com/ribru17/ts_query_ls/releases/download/v3.16.0/ts_query_ls-x86_64-unknown-linux-gnu.tar.gz \
            -o "$archive"
          echo '35859176141c3ebaac231000fd96d50a14c6bc26963f0a1662aac33f656d443d  '"$archive" | sha256sum --check -
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          config="$(jq -cn --arg parser_dir "$parser_dir" '{parser_install_directories: [$parser_dir], supported_abi_versions: {start: 15, end: 15}}')"
          "$RUNNER_TEMP/ts_query_ls" check "$query_workspace/queries" \
            --workspace "$query_workspace" --config "$config"

  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Disable shallow clone for better analysis relevancy
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8.2.2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      # The free SonarCloud plan locks every project to the built-in "Sonar way"
      # gate, which only fails on rating/coverage thresholds and lets new issues
      # (e.g. a single code smell) through. Enforce "zero new issues" ourselves:
      # the scan above waits for analysis (sonar.qualitygate.wait), so the count
      # is queryable here.
      - name: Fail on new SonarCloud issues
        if: github.event_name == 'pull_request'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./scripts/ci/sonar-new-issues.sh muxlang_tree-sitter-mux "${{ github.event.pull_request.number }}"
